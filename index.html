<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Kerala Service Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anek+Malayalam:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Slack-style workspace (mode rail · sidebar with booking channels · conversation + details pane) on desktop;
   Revolut-style single column with hero balance card, round quick actions and a bottom tab bar on phones. */
:root{
  --bg:#FFFFFF; --app:#F3F5FA; --surface:#FFFFFF; --sunk:#EEF1F8; --hover:#F6F8FC; --ink:#12182B; --muted:#5B6479; --line:#E2E7F1;
  --rail:#091233; --side:#0E1C4D; --side-ink:#C9D4F2; --side-dim:#8E9DCB; --side-strong:#FFFFFF; --side-active:#3461F0; --side-hover:rgba(255,255,255,.08); --side-line:rgba(255,255,255,.10);
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E7EDFD; --gold:#C2913A;
  --hero1:#1A2A9E; --hero2:#3366F5; --hero3:#5DA8FF; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.78); --hero-glass:rgba(255,255,255,.16);
  --ok:#17763F; --ok-soft:#DEF2E5; --warn:#8A5700; --warn-soft:#FBEED3; --bad:#B42318; --bad-soft:#FBE3E0; --info:#2455A4; --info-soft:#E0E9F8;
  --dot-ok:#3DBE7C; --dot-warn:#E5A233; --dot-bad:#E8605A; --dot-info:#6E9FF0;
  --av1:#2C7A59; --av2:#B06A27; --av3:#3A60A6; --av4:#8A4688; --av5:#AE3846; --av6:#557A1E; --av-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,40,30,.06),0 8px 24px rgba(16,40,30,.06);
  --f-ui:'Plus Jakarta Sans','Anek Malayalam','Noto Sans Malayalam',system-ui,sans-serif;
  --f-ml:'Anek Malayalam','Noto Sans Malayalam',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141C; --app:#0B0E14; --surface:#171B25; --sunk:#1F2430; --hover:#1A1F2A; --ink:#E7EAF3; --muted:#9AA3B8; --line:#2A3040;
  --rail:#050914; --side:#0A1330; --side-ink:#C2CCEA; --side-dim:#7C89B3; --side-strong:#FFFFFF; --side-active:#3B66F0; --side-hover:rgba(255,255,255,.07); --side-line:rgba(255,255,255,.08);
  --accent:#6E9BFF; --accent-ink:#071233; --accent-soft:#18234A; --gold:#D9AE5E;
  --hero1:#18258F; --hero2:#2E5BE0; --hero3:#4E90F2; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.76); --hero-glass:rgba(255,255,255,.13);
  --ok:#6FD39A; --ok-soft:#163326; --warn:#E8B55B; --warn-soft:#33281A; --bad:#F2857C; --bad-soft:#3A1D1A; --info:#8FB5F2; --info-soft:#1B2740;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11141C; --app:#0B0E14; --surface:#171B25; --sunk:#1F2430; --hover:#1A1F2A; --ink:#E7EAF3; --muted:#9AA3B8; --line:#2A3040;
  --rail:#050914; --side:#0A1330; --side-ink:#C2CCEA; --side-dim:#7C89B3; --side-strong:#FFFFFF; --side-active:#3B66F0; --side-hover:rgba(255,255,255,.07); --side-line:rgba(255,255,255,.08);
  --accent:#6E9BFF; --accent-ink:#071233; --accent-soft:#18234A; --gold:#D9AE5E;
  --hero1:#18258F; --hero2:#2E5BE0; --hero3:#4E90F2; --hero-ink:#FFFFFF; --hero-dim:rgba(255,255,255,.76); --hero-glass:rgba(255,255,255,.13);
  --ok:#6FD39A; --ok-soft:#163326; --warn:#E8B55B; --warn-soft:#33281A; --bad:#F2857C; --bad-soft:#3A1D1A; --info:#8FB5F2; --info-soft:#1B2740;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--app);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.15rem;font-weight:800}
h2{font-size:1.05rem;font-weight:800}
h3{font-size:.95rem;font-weight:800}
p{margin:0}
a{color:var(--accent)}
:lang(ml) body,.ml{font-family:var(--f-ml)}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:6px}
svg{flex:none}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:72px 268px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.app.guest{grid-template-columns:minmax(0,1fr)}
.app.guest .rail,.app.guest .side,.app.guest .tabbar{display:none}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;min-height:0}
.side{background:var(--side);color:var(--side-ink);overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:16px;min-height:0}
.main{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.tabbar{display:none}

.brand{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--hero2),var(--hero3));color:var(--hero-ink);font-family:var(--f-ml);font-weight:800;font-size:1.45rem;display:grid;place-items:center;margin-bottom:10px;line-height:1}
.rail-btn{width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--side-dim);font:inherit;font-size:.66rem;font-weight:700;cursor:pointer;padding:4px 0}
.rail-btn .tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--side-hover);color:var(--side-ink);border:2px solid transparent}
.rail-btn[aria-pressed="true"]{color:var(--side-strong)}
.rail-btn[aria-pressed="true"] .tile{background:var(--side-active);color:var(--side-strong);border-color:var(--side-strong)}
.rail-btn:hover .tile{border-color:var(--side-dim)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.rail-lang{background:var(--side-hover);border:0;color:var(--side-ink);font:inherit;font-weight:800;font-size:.8rem;width:40px;height:30px;border-radius:8px;cursor:pointer}
.rail-me{background:none;border:0;padding:0;cursor:pointer;border-radius:10px}

.side-head{padding:14px 16px 12px;border-bottom:1px solid var(--side-line);display:flex;flex-direction:column;gap:2px}
.side-head b{color:var(--side-strong);font-size:1rem;font-weight:800}
.side-head span{font-size:.8rem;color:var(--side-dim);display:flex;align-items:center;gap:6px}
.side-head i{width:8px;height:8px;border-radius:50%;background:var(--dot-ok);display:inline-block}
.side-nav{display:flex;flex-direction:column;gap:1px;padding:10px 0 4px}
.nav-item,.chan{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:0 8px;padding:6px 10px;border-radius:7px;background:none;border:0;color:var(--side-ink);font:inherit;font-size:.92rem;font-weight:600;text-align:left;cursor:pointer;min-height:34px}
.nav-item:hover,.chan:hover{background:var(--side-hover)}
.nav-item[aria-current="page"],.chan[aria-current="page"]{background:var(--side-active);color:var(--side-strong)}
.side-sec{display:flex;flex-direction:column;gap:1px;padding-top:10px}
.side-sec-h{display:flex;align-items:center;justify-content:space-between;padding:4px 18px;font-size:.78rem;font-weight:800;color:var(--side-dim);letter-spacing:.02em}
.side-add{background:none;border:0;color:var(--side-dim);cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.side-add:hover{background:var(--side-hover);color:var(--side-strong)}
.chan .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .cm{font-size:.72rem;color:var(--side-dim);font-family:var(--f-mono)}
.chan.unread .cn{color:var(--side-strong);font-weight:800}
.chan[aria-current="page"] .cm{color:var(--side-strong)}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--side-dim)}
.sdot.ok{background:var(--dot-ok)}.sdot.warn{background:var(--dot-warn)}.sdot.bad{background:var(--dot-bad)}.sdot.info{background:var(--dot-info)}
.badge{background:var(--dot-bad);color:var(--av-ink);border-radius:999px;font-size:.68rem;font-weight:800;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.side-empty{padding:4px 18px;font-size:.82rem;color:var(--side-dim)}

/* ---------- page chrome ---------- */
.phead{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);min-height:60px;background:var(--bg);flex:none}
.phead-t{min-width:0;flex:1}
.phead-t h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead-t p{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead-r{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--hover)}
.phead .back{display:none;border:0;background:none;margin-left:-8px}
.scroll{flex:1;overflow-y:auto;min-height:0}
.page{max-width:960px;margin:0 auto;padding:22px 24px 56px;display:flex;flex-direction:column;gap:24px}
.page > *{min-width:0}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plain{display:flex;flex-direction:column;gap:12px;min-width:0}
.empty{padding:28px 20px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--info-soft);color:var(--ink);font-size:.88rem}
.banner > span:not(.otpbox){flex:1;min-width:0}
.banner .btn{flex:none}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}
.banner.ok{background:var(--ok-soft)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--sunk);border-color:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--av-ink)}
.btn.sm{min-height:34px;padding:0 14px;font-size:.88rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
:focus-visible{outline:3px solid var(--hero3);outline-offset:2px}
form{display:flex;flex-direction:column;gap:14px;margin:0}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fields > *{min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.88rem}
label.f small{font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:88px;resize:vertical}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer;font-weight:500}
label.check input{width:20px;height:20px;min-height:20px;margin-top:2px;flex:none;accent-color:var(--accent);box-shadow:none}
fieldset{border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--surface)}
legend{font-weight:800;padding:0 6px}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:none;font:inherit;font-size:.85rem;font-weight:700;color:var(--muted);padding:6px 14px;border-radius:999px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.gold{background:transparent;box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.stars{color:var(--gold);letter-spacing:1px}
.av{display:inline-grid;place-items:center;color:var(--av-ink);font-weight:800;border-radius:9px;flex:none;line-height:1;text-transform:uppercase}
.av.round{border-radius:50%}
.otpbox{font-family:var(--f-mono);font-size:1.5rem;letter-spacing:.3em;padding:6px 14px;border-radius:10px;background:var(--surface);display:inline-block}

/* ---------- Revolut-style hero, quick actions, lists ---------- */
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:var(--hero-ink);border-radius:24px;padding:22px 22px 26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .lbl{color:var(--hero-dim);font-size:.85rem;font-weight:700}
.hero .big{font-size:clamp(2.1rem,6vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.5em;font-weight:700;opacity:.8}
.hero .sub{color:var(--hero-dim);font-size:.9rem}
.hero .strip{background:var(--hero-glass);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero .strip > div{flex:1;min-width:160px}
.hero .strip b{display:block}
.hero .btn{background:var(--hero-ink);color:var(--hero2);border-color:var(--hero-ink)}
.hero .btn.ghost{background:transparent;color:var(--hero-ink);border-color:var(--hero-dim)}
.hero h2{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800;letter-spacing:-.02em}
.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qa button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;font-size:.78rem;font-weight:700;color:var(--ink);cursor:pointer;padding:4px 2px;text-align:center;line-height:1.2}
.qa .ci{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative}
.qa button:hover .ci{background:var(--accent);color:var(--accent-ink)}
.qa .ci .badge{position:absolute;top:-2px;right:-2px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.ri{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;min-width:0}
.ri:last-child{border-bottom:0}
button.ri,.ri[data-go]{cursor:pointer}
button.ri:hover,.ri[data-go]:hover{background:var(--hover)}
.ri-ico{width:42px;height:42px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;flex:none}
.ri-ico.pos{background:var(--ok-soft);color:var(--ok)}
.ri-ico.acc{background:var(--accent-soft);color:var(--accent)}
.ri-ico.warn{background:var(--warn-soft);color:var(--warn)}
.ri-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ri-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-s{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--ok)}
.ri.unread .ri-t{font-weight:800}
.ri .when{font-size:.75rem;color:var(--muted);white-space:nowrap}
.daylabel{font-size:.8rem;font-weight:800;color:var(--muted);padding:2px 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.78rem;font-weight:700;color:var(--muted)}
.stat b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- find & book ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile span{font-size:.8rem;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.helper{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 14px;align-items:start;padding:16px;border-bottom:1px solid var(--line)}
.helper:last-child{border-bottom:0}
.helper .hm{display:flex;flex-direction:column;gap:3px;min-width:0}
.helper .hp{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.helper .price{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk);width:100%;max-width:200px;margin-top:4px}
.score i{display:block;height:100%}
.booklayout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.summary{position:sticky;top:0}
.summary .total{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.ledger td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.ledger td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.ledger tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;padding-top:8px}
.ledger tr.sep td{border-bottom:0;padding-top:12px;color:var(--muted);font-size:.8rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem;font-variant-numeric:tabular-nums}
table.data th,table.data td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.data tr:last-child td{border-bottom:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:10px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px}
.timeline li::after{content:"";position:absolute;left:4px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}

/* ---------- Slack-style conversation ---------- */
.chat-head .phead-t h1{font-size:1.02rem}
.chatwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;position:relative}
.convo{display:flex;flex-direction:column;min-height:0;min-width:0}
.feed{flex:1;overflow-y:auto;padding:0 0 10px;min-height:0}
.intro{padding:24px 20px 10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.intro-ico{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.intro h2{font-size:1.35rem}
.intro p{color:var(--muted);max-width:62ch}
.daydiv{display:flex;align-items:center;gap:12px;margin:14px 20px 4px;color:var(--muted);font-size:.76rem;font-weight:800}
.daydiv::before,.daydiv::after{content:"";flex:1;height:1px;background:var(--line)}
.daydiv span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;background:var(--bg)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 20px}
.msg:hover{background:var(--hover)}
.msg.cont{padding-top:1px;padding-bottom:3px}
.msg.cont > .av{visibility:hidden;height:1px}
.mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mh b{font-weight:800}
.mh time{font-size:.74rem;color:var(--muted)}
.mtext{white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:.62rem;font-weight:800;letter-spacing:.06em;background:var(--sunk);color:var(--muted);padding:1px 5px;border-radius:4px;align-self:center}
.sys{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;padding:3px 20px;color:var(--muted);font-size:.86rem}
.sys .si{width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;justify-self:center;color:var(--muted)}
.sys .si.ok{background:var(--ok-soft);color:var(--ok)}.sys .si.bad{background:var(--bad-soft);color:var(--bad)}.sys .si.acc{background:var(--accent-soft);color:var(--accent)}
.sys b{color:var(--ink);font-weight:700}
.sys time{font-size:.74rem;margin-left:6px}
.bot .block{border-left:4px solid var(--accent);padding:10px 14px;background:var(--sunk);border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:10px;margin-top:4px;max-width:640px}
.bot .block.warn{border-left-color:var(--dot-warn)}
.bot .block form{gap:10px}
.brandav{background:linear-gradient(135deg,var(--hero2),var(--hero3));color:var(--hero-ink);font-family:var(--f-ml);font-size:1.1rem}
.composer{margin:0 20px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:0;flex:none}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{border:0;min-height:46px;max-height:160px;resize:none;background:transparent;padding:12px 14px 4px;box-shadow:none;border-radius:14px}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 6px 14px}
.send{margin-left:auto;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;cursor:pointer}
.closed-note{margin:0 20px 16px;padding:12px 14px;border-radius:14px;background:var(--sunk);color:var(--muted);font-size:.88rem;flex:none}
.details{border-left:1px solid var(--line);overflow-y:auto;background:var(--bg);min-height:0}
.details-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.details-h .iconbtn{display:none}
.dsec{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dsec h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0;padding-bottom:0}
.dtoggle{display:none}
.phead .menu{display:none;border:0;background:none;margin-left:-8px}
.scrim{display:none}
.side-modes{display:none;margin-top:10px;background:var(--side-hover)}
.side-modes button{color:var(--side-dim);padding:5px 10px;min-height:30px;font-size:.8rem}
.side-modes button[aria-pressed="true"]{background:var(--side-active);color:var(--side-strong);box-shadow:none}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-hero{background:linear-gradient(150deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:var(--hero-ink);padding:48px 44px;display:flex;flex-direction:column;gap:22px;justify-content:center;position:relative}
.login-hero h1{font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.1;letter-spacing:-.025em;max-width:16ch}
.login-hero p{color:var(--hero-dim);max-width:46ch}
.login-hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.login-hero li{display:flex;gap:12px;align-items:center;font-weight:700}
.login-hero li span{width:40px;height:40px;border-radius:50%;background:var(--hero-glass);display:grid;place-items:center}
.login-side{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg)}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.login-card h2{font-size:1.6rem;letter-spacing:-.02em}
.phone{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.phone:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.phone span{display:grid;place-items:center;padding:0 12px;font-weight:800;background:var(--sunk);color:var(--muted)}
.phone input{border:0;border-radius:0;box-shadow:none;font-size:1.15rem;letter-spacing:.04em;min-height:54px}

/* ---------- sheets & toasts ---------- */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,15,10,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#sheet .panel{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;margin-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
#sheet .bigamt{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:max-content;max-width:min(92vw,520px);display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:.92rem;box-shadow:var(--shadow);font-weight:600}
#toast div.bad{background:var(--bad);color:var(--av-ink)}
@media (prefers-reduced-motion:no-preference){#toast div{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.4}}}

/* ---------- responsive ---------- */
@media (max-width:1200px){
  .chatwrap{grid-template-columns:minmax(0,1fr)}
  .details{display:none;position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);box-shadow:-12px 0 32px rgba(0,0,0,.18);z-index:4}
  .chatwrap.show-details .details{display:block}
  .details-h .iconbtn,.dtoggle{display:inline-grid}
}
@media (max-width:980px){ .booklayout{grid-template-columns:minmax(0,1fr)} .summary{position:static} }
@media (max-width:899px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .rail{display:none}
  .side-modes{display:inline-flex}
}
@media (max-width:599px){
  body{font-size:16px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail,.side{display:none}
  .phead .menu{display:inline-grid}
  .app.drawer .rail,.app.drawer .side{display:flex;position:fixed;top:0;bottom:0;z-index:16;padding-top:env(safe-area-inset-top,0px)}
  .app.drawer .rail{left:0;width:72px}
  .app.drawer .side{left:72px;width:min(290px,calc(100vw - 72px));box-shadow:12px 0 32px rgba(0,0,0,.3)}
  .app.drawer .side-modes{display:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:15}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 4px}
  .tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:.7rem;font-weight:700;color:var(--muted);padding:4px 0;cursor:pointer;position:relative;min-height:48px;justify-content:center}
  .tab[aria-current="page"]{color:var(--accent)}
  .tab .badge{position:absolute;top:0;left:calc(50% + 6px)}
  .phead{padding:8px 16px;min-height:56px}
  .phead .back{display:inline-grid}
  .page{padding:16px 16px 32px;gap:20px}
  .feed .msg,.feed .sys{padding-left:14px;padding-right:14px}
  .intro,.daydiv{padding-left:14px;padding-right:14px;margin-left:0;margin-right:0}
  .composer,.closed-note{margin:0 10px 10px}
  .composer-bar .hint{display:none}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-hero{padding:32px 20px 36px}
  .qa{gap:2px}
  .qa .ci{width:50px;height:50px}
  .helper{grid-template-columns:auto minmax(0,1fr)}
  .helper .hp{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .phead-r .pill{display:none}
}

/* ---------- store: shared artifact database, or this browser when unavailable ---------- */
const Store = (()=>{
  let db=null, mode="connecting", resolveReady;
  const ready = new Promise(r=>resolveReady=r);
  const local = {data:lsGet("ksc-local")||{}, subs:{}};
  const persist = ()=>lsSet("ksc-local",local.data);
  const listLocal = col=>Object.entries(local.data[col]||{}).map(([id,d])=>({...clone(d),id}));
  const emit = col=>(local.subs[col]||[]).forEach(cb=>cb(listLocal(col)));
  const strip = o=>{const c=clone(o);delete c.id;return c};
  const merge = (a,b)=>{const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))?merge(o[k],v):v}return o};
  return {
    ready, get mode(){return mode},
    async init(){
      try{
        if(window.claude&&window.claude.use){
          const d = await window.claude.use("db");
          if(d){ db=d; mode="shared";
            const u = await window.claude.use("user");
            S.isOwner = u ? await u.isOwner() : false;
          }
        }
      }catch(e){}
      if(!db) mode="local";
      resolveReady();
    },
    watch(col,cb){
      ready.then(()=>{
        if(db) db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))), e=>toast("Live updates stopped ("+e.code+"). Reload the page to reconnect.","bad"));
        else { (local.subs[col]=local.subs[col]||[]).push(cb); cb(listLocal(col)); }
      });
    },
    async get(col,id){ await ready;
      if(db){const s=await db.doc(col+"/"+id).get();return s.exists?{...s.data(),id:s.id}:null}
      const d=(local.data[col]||{})[id]; return d?{...clone(d),id}:null },
    async where(col,f,v){ await ready;
      if(db){const s=await db.collection(col).where(f,"==",v).get();return s.docs.map(d=>({...d.data(),id:d.id}))}
      return listLocal(col).filter(d=>d[f]===v) },
    async set(col,id,data){ await ready;
      if(db) return db.doc(col+"/"+id).set(strip(data));
      (local.data[col]=local.data[col]||{})[id]=strip(data); persist(); emit(col) },
    async update(col,id,patch){ await ready;
      if(db) return db.doc(col+"/"+id).update(strip(patch));
      const c=local.data[col]||{}; if(!c[id]) throw new Error("That record no longer exists.");
      c[id]=merge(c[id],strip(patch)); persist(); emit(col) },
    async lock(key,fn){ await ready;
      if(!db) return fn();
      const ref=db.doc("locks/"+key);
      for(let i=0;i<8;i++){ const r=await ref.acquire({holder:TAB,ttlMs:8000}); if(r.acquired) return fn(); await sleep(350+Math.random()*400); }
      throw new Error("Someone else is updating this booking right now. Try again in a moment.") }
  };
})();

const S = {me:null, mode:"customer", lang:lsGet("ksc-lang")||"en", view:"login", p:{}, providers:[], bookings:[], incidents:[], isOwner:false, otp:null, details:false, messages:[], seen:{}, sends:{}, lastEvent:null, sheet:null, busy:false};
const myProvider = ()=>S.me && S.providers.find(p=>p.id===S.me.mobile);

const bookingById = id=>S.bookings.find(b=>b.id===id);
const displayStatus = b=>(b.status==="REQUESTED" && new Date(b.start)<new Date())?"EXPIRED":b.status;

function providerStats(pid){
  const mine = S.bookings.filter(b=>b.providerId===pid);
  const reviews = mine.filter(b=>b.review);
  const decided = mine.filter(b=>b.history&&b.history.some(h=>["ACCEPTED","REJECTED"].includes(h.to)) || displayStatus(b)==="EXPIRED");
  const accepted = decided.filter(b=>b.history.some(h=>h.to==="ACCEPTED"));
  return {
    rating: reviews.length ? reviews.reduce((a,b)=>a+b.review.stars,0)/reviews.length : null,
    reviews: reviews.length,
    reliability: decided.length ? accepted.length/decided.length : null,
    done: mine.filter(b=>["COMPLETED","SETTLED"].includes(b.status)).length
  };
}
function eligible(p, svc, ward, start, end, excludeId){
  const why=[];
  if(p.status!=="APPROVED") why.push("not approved");
  const exp = p.verification&&p.verification.expiresAt;
  if(!exp || new Date(exp)<end) why.push("verification expired");
  const offer = (p.services||[]).find(s=>s.code===svc.code);
  if(!offer) why.push("does not offer this service");
  if(dist(p.ward,ward)>p.radiusKm) why.push("outside travel radius");
  const a=istParts(start), b=istParts(new Date(end-1));
  if(!(p.days||[]).includes(a.day) || a.date!==b.date || a.min<hm(p.from) || b.min+1>hm(p.to)) why.push("not available at that time");
  if(S.bookings.some(x=>x.providerId===p.id && x.id!==excludeId && ACTIVE.includes(x.status) && new Date(x.start)<end && start<new Date(x.end))) why.push("already booked");
  return {ok:!why.length, why, offer};
}
function rankHelpers(svc, ward, start, end){
  const pool = S.providers.map(p=>({p,...eligible(p,svc,ward,start,end)})).filter(x=>x.ok);
  if(!pool.length) return [];
  const minRate = Math.min(...pool.map(x=>x.offer.rateP));
  return pool.map(({p,offer})=>{
    const st=providerStats(p.id), d=dist(p.ward,ward);
    const repeat = S.bookings.some(b=>b.providerId===p.id && S.me && b.customerMobile===S.me.mobile && ["COMPLETED","SETTLED"].includes(b.status));
    const parts = {
      rating:.30*(st.rating==null?.7:st.rating/5),
      distance:.25*(1-Math.min(1,d/Math.max(p.radiusKm,1))),
      price:.20*(minRate/offer.rateP),
      reliability:.15*(st.reliability==null?.8:st.reliability),
      repeat:.10*(repeat?1:0)
    };
    return {p,offer,d,st,repeat,parts,score:Object.values(parts).reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>b.score-a.score);
}
function quote(svc, rateP, durMin, distKm, extra){
  const billMin = svc.mode==="FIXED" ? null : Math.max(svc.min, Math.ceil(durMin/30)*30);
  const service = svc.mode==="FIXED" ? rateP : Math.round(rateP*billMin/60);
  const travel = distKm>FEES.travelFreeKm ? FEES.travelP : 0;
  const platform = Math.round(service*FEES.platformPct/100);
  const gst = Math.round(platform*FEES.gstPct/100);
  const total = service+travel+platform+gst;
  const advance = (extra&&extra.budgetP)||0;
  return {rateP, mode:svc.mode, billMin, service, travel, platform, gst, total, advance, officialFees:(extra&&extra.feesP)||0, payNow:total+advance};
}
function money(b){
  const ok = (b.adjustments||[]).filter(a=>a.status==="APPROVED");
  const adj = ok.reduce((s,a)=>s+a.amountP,0), adjService = ok.reduce((s,a)=>s+(a.serviceP||0),0);
  const charges = b.price.total + b.price.advance + adj;
  const paid = (b.payment&&b.payment.paidP)||0, refunded = b.refundedP||0;
  const closed=["CANCELLED","REJECTED","EXPIRED"].includes(b.status);
  return {adj, adjService, charges, paid, refunded, due:closed?0:Math.max(0,charges-paid)};
}
function shoppingSpent(b){
  if(!b.shopping) return 0;
  return (b.shopping.receipts||[]).reduce((s,r)=>s+r.totalP,0);
}

function needsAttention(){
  const out=[];
  for(const b of S.bookings.filter(x=>x.customerMobile===S.me.mobile)){
    const m=money(b), ds=displayStatus(b);
    if(ds==="ACCEPTED") out.push({b,icon:"rupee",cls:"warn",t:`Pay ${inr(m.due)} to confirm`,s:`${b.providerName} accepted · ${svcName(b.serviceCode)}`});
    else if(m.due>0&&["CONFIRMED","IN_PROGRESS","COMPLETED"].includes(b.status)) out.push({b,icon:"rupee",cls:"warn",t:`Balance due ${inr(m.due)}`,s:svcName(b.serviceCode)});
    (b.adjustments||[]).filter(a=>a.status==="PENDING").forEach(a=>out.push({b,icon:"clock",cls:"warn",t:`Approve ${a.minutes} more minutes?`,s:`${b.providerName} asked · ${inr(a.amountP)}`}));
    if(b.shopping) b.shopping.items.forEach(it=>{ if(it.sub&&it.sub.status==="PROPOSED") out.push({b,icon:"cart",cls:"warn",t:`Substitute for ${it.name}?`,s:`${b.providerName} suggests ${it.sub.text}`}); });
    if(["COMPLETED","SETTLED"].includes(b.status)&&!b.review) out.push({b,icon:"star",cls:"acc",t:`Rate your visit with ${b.providerName}`,s:svcName(b.serviceCode)});
  }
  return out;
}

function priceTable(q,extra){
  const rows=[[q.mode==="FIXED"?"Service (fixed fee)":`Service ${inr(q.rateP)}/hr × ${q.billMin/60} hr`,q.service],...(q.travel?[["Travel (over 2 km)",q.travel]]:[]),[`Platform fee ${FEES.platformPct}%`,q.platform],[`GST ${FEES.gstPct}% on platform fee`,q.gst]];
  let h=`<table class="ledger">${rows.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${inr(v)}</td></tr>`).join("")}`;
  if(extra&&extra.adj) h+=`<tr><td>Approved extras & adjustments</td><td>${inr(extra.adj)}</td></tr>`;
  h+=`<tr class="total"><td>Helper charges</td><td>${inr(q.total+((extra&&extra.adj)||0))}</td></tr>`;
  if(q.advance) h+=`<tr class="sep"><td colspan="2">Kept separate from helper earnings</td></tr><tr><td>Purchase advance (unspent part refunded)</td><td>${inr(q.advance)}</td></tr>`;
  if(q.officialFees) h+=`<tr class="sep"><td colspan="2">Paid by you at the office</td></tr><tr><td>Expected official fee (not collected)</td><td>${inr(q.officialFees)}</td></tr>`;
  return h+`</table>`;
}

/* wallet */
views.wallet = ()=>{
  const tx=txFor(), prov=S.mode==="provider";
  const month=tx.filter(x=>thisMonth(x.e.at));
  const net=month.reduce((s,x)=>s+x.sign*x.amt,0), refunds=month.filter(x=>x.sign>0).reduce((s,x)=>s+x.amt,0);
  const groups=[]; for(const x of tx){const d=istDate(new Date(x.e.at)); const g=groups[groups.length-1]; if(g&&g.d===d) g.items.push(x); else groups.push({d,items:[x]});}
  const big=v=>inr(v).replace(/\.(\d\d)$/,"<small>.$1</small>");
  const hero = prov
    ? `<section class="hero"><span class="lbl">Paid out this month</span><div class="big">${big(net)}</div><span class="sub">${inr(pendingSettlement(S.me.mobile))} waiting for settlement after completed visits</span></section>`
    : `<section class="hero"><span class="lbl">Spent this month</span><div class="big">${big(-net)}</div><span class="sub">${month.filter(x=>x.sign<0).length} payment${month.filter(x=>x.sign<0).length===1?"":"s"} · ${inr(refunds)} refunded</span></section>`;
  return page(esc(prov?t("earnings"):t("wallet")),prov?"Payouts from completed visits":"Payments and refunds","",`${hero}
    ${groups.length?groups.map(g=>`<section><span class="daylabel">${esc(dayLabel(g.d))}</span><div class="group">${g.items.map(txRow).join("")}</div></section>`).join("")
      :`<div class="empty">${ico("wallet",28)}<span>${prov?"Payouts appear here once operations settles a completed visit.":"Nothing here yet. Your payments and refunds will be listed by day."}</span></div>`}
    <p class="small muted">Shopping advances and refunds are kept apart from helper fees. Official government fees are paid at the office and never pass through the app.</p>`);
};

/* ---------- booking as a conversation ---------- */
function roleName(h,b){ return {customer:b.customerName,helper:b.providerName,operations:"Operations",gateway:"Payments",system:"Kerala Service Connect"}[h.role]||h.role; }
function sysLine(h,b){
  const to=h.to, n=(h.note||"").toLowerCase();
  const [icon,cls] = /sos/.test(n)?["alert","bad"] : ["CANCELLED","REJECTED","EXPIRED","DISPUTED"].includes(to)&&h.from!==to?["x","bad"] : /payment|paid|refund/.test(n)?["rupee","ok"] : ["COMPLETED","CONFIRMED","SETTLED","ACCEPTED"].includes(to)&&h.from!==to?["check","ok"] : /receipt|item|substitut/.test(n)?["cart","acc"] : ["clock",""];
  return `<div class="sys"><span class="si ${cls}">${ico(icon,14)}</span><span><b>${esc(roleName(h,b))}</b> · ${esc(h.note||(STATUS[to]||[to])[0])}<time>${esc(fmtT(h.at))}</time></span></div>`;
}
function msgRow(m,cont){
  const name=m.role==="operations"?"Operations":(m.name||"Someone");
  return `<div class="msg ${cont?"cont":""}">${avatar(name,m.role==="operations"?"ops":m.from,36)}<div>${cont?"":`<div class="mh"><b>${esc(name)}</b>${m.role==="operations"?`<span class="tag">STAFF</span>`:m.role==="helper"?`<span class="tag">HELPER</span>`:""}<time>${esc(fmtT(m.at))}</time></div>`}<div class="mtext">${esc(m.text)}</div></div></div>`;
}
function nextStep(b,f){
  const ds=displayStatus(b), m=money(b), who=b.providerName.split(" ")[0], cust=b.customerName.split(" ")[0];
  const C=f.isCust&&S.mode==="customer", P=f.isProv&&S.mode==="provider";
  switch(ds){
    case "REQUESTED": return P?`New request from ${cust}. Accept to reserve this time.`:`Waiting for ${who} to accept. You won't be charged until then.`;
    case "ACCEPTED": return C?`${who} accepted. Pay ${inr(m.due)} to confirm the booking.`:`Accepted. Waiting for ${cust} to pay.`;
    case "CONFIRMED": return P?`Confirmed and paid. Check in when you arrive.`:`Confirmed. ${who} will check in at the start time.`;
    case "IN_PROGRESS": return P?`Visit in progress.${b.shopping?" Update the shopping list in Details.":""}${b.gov?" Record progress in Details.":""} Check out when you're done.`:`Visit in progress. ${who} checked in at ${fmtT(b.session&&b.session.checkInAt||b.start)}.`;
    case "COMPLETED": return m.due>0?`Visit complete. Balance due: ${inr(m.due)}.`:(f.isAdmin&&S.mode==="admin"?"Visit complete and paid. Ready to settle.":"Visit complete.");
    case "SETTLED": return "Visit complete and the helper has been paid.";
    case "DISPUTED": return "Dispute open. Operations is reviewing and the payout is on hold.";
    case "EXPIRED": return "This request expired without a response.";
    case "REJECTED": return `${who} couldn't take this booking. Find another helper.`;
    case "CANCELLED": return "This booking was cancelled.";
  }
  return "";
}
function botBlock(b,f){
  const ds=displayStatus(b), m=money(b), A=[];
  const btn=(act,label,cls="")=>`<button class="btn sm ${cls}" data-act="${act}" data-id="${esc(b.id)}">${label}</button>`;
  const P=f.isProv&&S.mode==="provider", C=f.isCust&&S.mode==="customer", ADM=f.isAdmin&&S.mode==="admin";
  if(P){
    if(ds==="REQUESTED"){A.push(btn("tr:accept",ico("check",16)+" "+t("accept")));A.push(btn("tr:reject",t("reject"),"ghost"));}
    if(b.status==="CONFIRMED") A.push(btn("tr:checkin",t("checkin")));
    if(b.status==="IN_PROGRESS"){A.push(btn("checkout",t("checkout")));A.push(btn("extraTime","Ask for 30 more min","ghost"));}
  }
  if(C){
    if(b.status==="ACCEPTED"||(m.due>0&&["CONFIRMED","IN_PROGRESS","COMPLETED"].includes(b.status))) A.push(btn("pay",`${t("pay")} ${inr(m.due)}`));
    if(["REQUESTED","ACCEPTED","CONFIRMED"].includes(b.status)&&ds!=="EXPIRED") A.push(btn("cancel",t("cancel"),"ghost"));
    if(b.status==="COMPLETED") A.push(btn("dispute","Dispute","ghost"));
    if(["REJECTED","EXPIRED"].includes(ds)) A.push(`<button class="btn sm" data-go="find" data-svc="${esc(b.serviceCode)}">Find another helper</button>`);
  }
  if(ADM&&b.status==="COMPLETED") A.push(btn("settle","Settle payout"));
  if((f.isCust||f.isProv)&&S.mode!=="admin"&&!["REQUESTED","REJECTED","EXPIRED","CANCELLED"].includes(ds)) A.push(btn("incident",t("report"),"quiet"));
  let extra="";
  if(C){
    (b.adjustments||[]).filter(a=>a.status==="PENDING").forEach(a=>{extra+=`<div class="block warn"><span><b>${esc(b.providerName)}</b> asks for ${a.minutes} more minutes (${inr(a.amountP)}).</span><div class="row"><button class="btn sm" data-act="adj" data-id="${b.id}" data-aid="${a.id}" data-v="APPROVED">Approve</button><button class="btn ghost sm" data-act="adj" data-id="${b.id}" data-aid="${a.id}" data-v="DECLINED">Decline</button></div></div>`;});
    if(b.shopping) b.shopping.items.forEach((it,i)=>{ if(it.sub&&it.sub.status==="PROPOSED") extra+=`<div class="block warn"><span><b>${esc(it.name)}</b> isn't available. Substitute with <b>${esc(it.sub.text)}</b>?</span><div class="row"><button class="btn sm" data-act="subDecide" data-id="${b.id}" data-i="${i}" data-v="APPROVED">Approve</button><button class="btn ghost sm" data-act="subDecide" data-id="${b.id}" data-i="${i}" data-v="DECLINED">Decline</button></div></div>`; });
    if(["COMPLETED","SETTLED"].includes(b.status)&&!b.review) extra+=`<div class="block"><b>${esc(t("review"))}</b><form data-form="review" data-id="${b.id}"><div class="fields"><label class="f" for="rv-stars">Rating<select id="rv-stars">${[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)} ${n}</option>`).join("")}</select></label></div><label class="f" for="rv-text">Comments<textarea id="rv-text" placeholder="What went well?"></textarea></label><div><button class="btn sm" type="submit">Submit review</button></div></form></div>`;
  }
  return `<div class="msg bot">${`<span class="av brandav" style="width:36px;height:36px">ക</span>`}<div><div class="mh"><b>Kerala Service Connect</b><span class="tag">APP</span></div>
    <div class="block"><span>${esc(nextStep(b,f))}</span>${A.length?`<div class="row">${A.join("")}</div>`:""}</div>${extra}</div></div>`;
}
function feedHtml(b,f){
  const items=[...(b.history||[]).map(h=>({k:"s",at:h.at,h})),...msgsFor(b.id).map(m=>({k:"m",at:m.at,m}))].sort((x,y)=>x.at.localeCompare(y.at));
  const c=f.isProv?b.customerName:b.providerName;
  let out=`<div class="intro"><span class="intro-ico">${ico(CAT_ICON[b.category]||"chat",28)}</span><h2>${esc(svcName(b.serviceCode))}</h2>
    <p>This is the start of booking <b class="mono">${esc(b.bookingNo)}</b> between <b>${esc(b.customerName)}</b> and <b>${esc(b.providerName)}</b>. Messages here are seen by both of you and by the operations team. Never share OTPs or bank details.</p>
    <div class="row"><span class="chip">${ico("clock",14)} ${esc(fmtDT(b.start))} – ${esc(fmtT(b.end))}</span><span class="chip">${esc(WARD[b.ward]?WARD[b.ward].name:"")}</span></div></div>`;
  let lastDay="", last=null;
  for(const it of items){
    const day=istDate(new Date(it.at));
    if(day!==lastDay){out+=`<div class="daydiv"><span>${esc(dayLabel(day))}</span></div>`;lastDay=day;last=null;}
    if(it.k==="s"){out+=sysLine(it.h,b);last=null;continue;}
    const m=it.m, cont=last&&last.from===m.from&&(new Date(m.at)-new Date(last.at))<300000;
    out+=msgRow(m,cont); last=m;
  }
  return out+botBlock(b,f);
}
views.booking = ()=>{
  const b=bookingById(S.p.id), back=S.mode==="admin"?"admin:bookings":"bookings";
  if(!b) return page("Booking","","",`<div class="empty">Loading booking…</div>`,{back});
  const ds=displayStatus(b), f={isCust:S.me.mobile===b.customerMobile, isProv:S.me.mobile===b.providerId, isAdmin:S.mode==="admin"&&canAdmin()};
  if(!f.isCust&&!f.isProv&&!f.isAdmin) return page("Booking","","",`<div class="empty">You don't have access to this booking.</div>`,{back});
  markSeen(b.id);
  const c=f.isProv&&S.mode!=="admin"?{name:b.customerName,id:b.customerMobile}:{name:b.providerName,id:b.providerId};
  const sos=(f.isCust||f.isProv)&&["CONFIRMED","IN_PROGRESS"].includes(b.status);
  const closed=["REJECTED","EXPIRED","CANCELLED"].includes(ds);
  const openInc=S.incidents.filter(i=>i.bookingId===b.id&&i.status==="OPEN");
  return `<header class="phead chat-head"><button class="iconbtn menu" data-act="menu" aria-label="Open sidebar">${ico("menu")}</button><button class="iconbtn back" data-go="${back}" aria-label="Back">${ico("back")}</button>
    ${avatar(c.name,c.id,36)}
    <div class="phead-t"><h1>${esc(svcName(b.serviceCode))} · ${esc(c.name)}</h1><p><span class="mono">${esc(b.bookingNo)}</span> · ${esc(fmtDT(b.start))}</p></div>
    <div class="phead-r">${pill(ds)}${sos?`<button class="btn danger sm" data-act="sos" data-id="${esc(b.id)}">${ico("alert",16)} SOS</button>`:""}<button class="iconbtn dtoggle" data-act="toggleDetails" aria-label="Show details" title="Details">${ico("info")}</button></div></header>
  ${openInc.length?`<div class="banner bad" style="border-radius:0">${ico("alert",18)}<span><b>${openInc.length} open incident${openInc.length>1?"s":""}.</b> Operations is reviewing. In an emergency call 112.</span></div>`:""}
  <div class="chatwrap ${S.details?"show-details":""}">
    <section class="convo">
      <div class="feed" id="feed" role="log" aria-label="Booking conversation">${feedHtml(b,f)}</div>
      ${closed?`<div class="closed-note">This booking is closed, so the chat is read-only.</div>`
      :`<form data-form="sendMsg" data-id="${esc(b.id)}" class="composer"><textarea id="msg-input" aria-label="Message" rows="1" maxlength="2000" placeholder="Message ${esc(S.mode==="admin"?"both parties":c.name.split(" ")[0])}"></textarea>
        <div class="composer-bar"><span class="small muted hint">Enter to send · Shift+Enter for a new line</span><button class="send" type="submit" aria-label="Send">${ico("send",18)}</button></div></form>`}
    </section>
    <aside class="details" aria-label="Booking details">${detailsHtml(b,f)}</aside>
  </div>`;
};

  <section class="dsec"><h3>Visit</h3><dl class="kv">

    <dt>When</dt><dd>${esc(fmtDT(b.start))} – ${esc(fmtT(b.end))}</dd>

    <table class="ledger"><tr><td>Paid</td><td>${inr(m.paid)}</td></tr>${m.refunded?`<tr><td>Refunded</td><td>${inr(m.refunded)}</td></tr>`:""}<tr class="total"><td>Balance due</td><td>${inr(m.due)}</td></tr></table></section>
  ${(b.ledger||[]).length?`<section class="dsec"><h3>Ledger</h3><table class="ledger">${b.ledger.map(e=>`<tr><td>${esc(e.type.replace(/_/g," ").toLowerCase())}<br><span class="mono small muted">${esc(e.ref||"")}</span></td><td>${inr(e.amountP)}</td></tr>`).join("")}</table></section>`:""}
  ${b.settlement?`<section class="dsec"><h3>Helper settlement</h3><table class="ledger"><tr><td>Service, travel & extras</td><td>${inr(b.settlement.earnedP)}</td></tr><tr><td>Commission ${FEES.commissionPct}%</td><td>−${inr(b.settlement.commissionP)}</td></tr><tr><td>Purchase reimbursement</td><td>${inr(b.settlement.reimburseP)}</td></tr><tr class="total"><td>Payout</td><td>${inr(b.settlement.payoutP)}</td></tr></table></section>`:""}
  ${b.review?`<section class="dsec"><h3>Review</h3><p><span class="stars">${stars(b.review.stars)}</span></p>${b.review.text?`<p>${esc(b.review.text)}</p>`:""}</section>`:""}
  ${testPanel(b,f.isCust,f.isAdmin)}`;
}
function elderlyPanel(b){const e=b.elderly;return `<section class="dsec"><h3>Visit for ${esc(e.beneficiary)}</h3>
  <dl class="kv"><dt>Relation</dt><dd>${esc(e.relation)} of ${esc(b.customerName)}</dd><dt>Emergency</dt><dd>${esc(e.emergency)}</dd>${e.instructions?`<dt>Instructions</dt><dd>${esc(e.instructions)}</dd>`:""}</dl>

function shoppingPanel(b,isCust,isProv){

  return `<section class="dsec"><div class="spread"><h3>Shopping list</h3><span class="small muted num">${inr(spent)} of ${inr(s.budgetP)}</span></div>

  <ul class="items">${s.items.map((it,i)=>`<li><div class="spread"><span>${esc(it.name)}</span>${pill(it.status==="BOUGHT"?"OK_B":it.status==="PENDING"?"TO_BUY":it.status)}</div>

      ${s.subs==="ASK"&&!it.sub?`<div class="row"><input id="sub-${i}" placeholder="Suggest a substitute" style="flex:1;min-width:120px;min-height:38px"><button class="btn quiet sm" data-act="subPropose" data-id="${b.id}" data-i="${i}">Ask</button></div>`:""}`:""}</li>`).join("")}</ul>
  ${(s.receipts||[]).length?`<table class="ledger">${s.receipts.map(r=>`<tr><td>${esc(r.shop)}<br><span class="small muted">${esc(fmtT(r.at))}${r.note?" · "+esc(r.note):""}</span></td><td>${inr(r.totalP)}</td></tr>`).join("")}</table>`:""}
  ${isProv&&live?`<form data-form="receipt" data-id="${b.id}"><div class="fields"><label class="f" for="r-shop">Shop<input id="r-shop" required></label><label class="f" for="r-total">Receipt total (₹)<input id="r-total" inputmode="decimal" required></label></div><label class="f" for="r-note">Itemised note<input id="r-note" placeholder="Rice 5kg ₹310, oil ₹195…"></label><div><button class="btn quiet sm" type="submit">Add receipt</button></div></form>`:""}
  ${s.reconciled?`<p class="small">Reconciled: ${inr(spent)} spent, ${inr(s.budgetP-spent)} refunded.</p>`:""}</section>`;
}

  return `<section class="dsec"><h3>${esc(g.purpose)} · ${esc(g.office)}</h3>

}
function testPanel(b,isCust,isAdmin){

      <span class="sub">${inr(pendingSettlement(p.id))} waiting for settlement</span>

async function guard(fn){
  if(S.busy) return; S.busy=true;
  try{ await fn() }catch(e){ console.error(e); toast(e.message||("Could not save: "+(e.code||"error")),"bad") } finally{ S.busy=false }

const hist=(b,to,note)=>[...(b.history||[]),{at:nowISO(),from:b.status,to,by:S.me.mobile,role:S.mode==="admin"?"operations":S.mode==="provider"?"helper":"customer",note:note||""}];
const TR = {
  accept:{from:["REQUESTED"],to:"ACCEPTED",who:"provider",note:"Helper accepted"},
  reject:{from:["REQUESTED"],to:"REJECTED",who:"provider",note:"Helper declined"},
  checkin:{from:["CONFIRMED"],to:"IN_PROGRESS",who:"provider",note:"Helper checked in"}
};
async function transition(id,action){
  const tr=TR[action];
  await Store.lock("b_"+id, async()=>{
    const b=await Store.get("bookings",id);
    if(!b) throw new Error("Booking not found.");
    if(!tr.from.includes(b.status)) throw new Error(`This booking is ${STATUS[b.status][0].toLowerCase()} now, so it can't be changed that way.`);
    if(tr.who==="provider"&&b.providerId!==S.me.mobile) throw new Error("Only the assigned helper can do this.");
    const patch={status:tr.to, version:(b.version||0)+1, history:hist(b,tr.to,tr.note)};
    if(action==="accept"){
      if(new Date(b.start)<new Date()) throw new Error("This request has expired.");
      const p=await Store.get("providers",b.providerId);
      if(!p||p.status!=="APPROVED") throw new Error("Your profile must be approved before you can accept bookings.");
      const theirs=await Store.where("bookings","providerId",b.providerId);
      const clash=theirs.find(x=>x.id!==b.id&&ACTIVE.includes(x.status)&&new Date(x.start)<new Date(b.end)&&new Date(b.start)<new Date(x.end));
      if(clash) throw new Error(`You already have ${clash.bookingNo} at that time.`);
      patch.payment={...b.payment, orders:[...(b.payment.orders||[]), {orderId:"order_"+rid(10), amountP:money(b).charges, at:nowISO()}]};
    }
    if(action==="checkin"){ patch.session={checkInAt:nowISO()}; if(b.elderly&&b.elderly.notify) patch.history.push({at:nowISO(),to:"IN_PROGRESS",by:"system",role:"system",note:"Family notified of check-in"}); }
    await Store.update("bookings",id,patch);
  });
  toast(TR[action].note+".");
}
async function createBooking(){

  const extra={};
  if(svc.cat==="ELDERLY"){
    if(!v("b-consent")) throw new Error("Confirm that the person receiving the visit agrees to it.");
    extra.elderly={beneficiary:v("b-ben"),relation:v("b-rel"),emergency:v("b-emer"),instructions:v("b-instr"),consent:true,notify:v("b-notify")};
  }
  if(svc.cat==="SHOPPING"){
    const items=v("b-items").split("\n").map(s=>s.trim()).filter(Boolean);
    const budgetP=toP(v("b-budget"));
    if(!items.length) throw new Error("Add at least one item to the shopping list.");
    if(budgetP<10000) throw new Error("Set a spending cap of at least ₹100.");
    if(code==="SHOP_PRESCRIPTION"&&!v("b-rx")) throw new Error("Confirm you hold a valid prescription.");
    extra.shopping={items:items.map(name=>({name,status:"PENDING",sub:null})),budgetP,shop:v("b-shop"),subs:v("b-subs"),receipts:[],reconciled:false};
  }
  if(svc.cat==="GOVERNMENT"){
    if(!v("b-auth")) throw new Error("Tick the authorisation so the helper can carry your documents.");
    extra.gov={office:v("b-office"),purpose:v("b-purpose"),feesP:toP(v("b-fees")),docs:v("b-docs").split("\n").map(s=>s.trim()).filter(Boolean),authorised:true,updates:[],refNo:""};
  }
  await Store.lock("p_"+pid, async()=>{
    const p=await Store.get("providers",pid);
    if(!p) throw new Error("That helper is no longer available.");
    const theirs=await Store.where("bookings","providerId",pid);
    const saved=S.bookings; S.bookings=theirs;
    const el=eligible(p,svc,ward,start,end); S.bookings=saved;
    if(!el.ok) throw new Error("This slot is no longer available: "+el.why.join(", ")+".");
    const q=quote(svc,el.offer.rateP,+dur,dist(p.ward,ward),{budgetP:extra.shopping?extra.shopping.budgetP:0,feesP:extra.gov?extra.gov.feesP:0});
    const id=rid(12), ist=istParts(new Date());
    const b={bookingNo:`KSC-${ist.date.slice(2).replace(/-/g,"")}-${rid(4).toUpperCase()}`, customerMobile:S.me.mobile, customerName:S.me.name, providerId:pid, providerName:p.name,
      serviceCode:code, category:svc.cat, ward, address:v("b-addr"), notes:v("b-notes"), start:start.toISOString(), end:end.toISOString(), durationMin:+dur,
      status:"REQUESTED", version:0, createdAt:nowISO(), price:q, payment:{paidP:0,events:[],orders:[]}, refundedP:0, ledger:[], adjustments:[], review:null, settlement:null,
      elderly:extra.elderly||null, shopping:extra.shopping||null, gov:extra.gov||null,
      history:[{at:nowISO(),from:null,to:"REQUESTED",by:S.me.mobile,role:"customer",note:"Booking requested"}]};
    if(!b.address) throw new Error("Add the address where the helper should come.");
    await Store.set("bookings",id,b);
    toast("Request sent to "+p.name+". You'll pay once they accept.");
    go("booking",{id});
  });
}
async function payFlow(id){

  const orderId = order&&order.amountP===m.due ? order.orderId : "order_"+rid(10);

    <button class="btn ghost" data-act="gw" data-v="fail" data-id="${id}">Simulate failure</button></div>
    <button class="btn quiet sm" data-act="closeSheet">Close</button>`);

async function webhook(evt){
  await Store.lock("b_"+evt.bookingId, async()=>{
    const expect=await sha256([GATEWAY_SECRET,evt.id,evt.orderId,evt.amountP].join("|"));
    if(expect!==evt.signature) throw new Error("Webhook rejected: signature does not match. Nothing was recorded.");
    const b=await Store.get("bookings",evt.bookingId);
    if((b.payment.events||[]).includes(evt.id)){ toast("Duplicate webhook "+evt.id+" ignored. No second charge."); return; }
    const patch={payment:{paidP:(b.payment.paidP||0)+evt.amountP, events:[...(b.payment.events||[]),evt.id], orders:b.payment.orders||[]},
      ledger:[...(b.ledger||[]),{type:"CUSTOMER_PAYMENT",amountP:evt.amountP,ref:evt.id,at:nowISO()}], version:(b.version||0)+1};
    if(b.status==="ACCEPTED"){patch.status="CONFIRMED";patch.history=hist(b,"CONFIRMED","Payment confirmed by gateway");patch.history[patch.history.length-1].role="gateway";}
    else patch.history=[...(b.history||[]),{at:nowISO(),to:b.status,by:"gateway",role:"gateway",note:"Balance payment received "+inr(evt.amountP)}];
    await Store.update("bookings",b.id,patch);
    toast("Payment of "+inr(evt.amountP)+" confirmed.");
  });
}
async function cancelBooking(id){
  await Store.lock("b_"+id, async()=>{
    const b=await Store.get("bookings",id);
    if(!["REQUESTED","ACCEPTED","CONFIRMED"].includes(b.status)) throw new Error("This booking can no longer be cancelled.");
    if(b.customerMobile!==S.me.mobile) throw new Error("Only the customer can cancel.");
    const m=money(b), early=new Date(b.start)-new Date()>=86400000;
    const refund = m.paid ? (early ? m.paid : Math.max(0, m.paid-Math.round(b.price.service*0.5))) : 0;
    const patch={status:"CANCELLED",version:(b.version||0)+1,history:hist(b,"CANCELLED",early||!m.paid?"Cancelled by customer":"Cancelled within 24 hours · 50% of service fee retained")};
    if(refund){patch.refundedP=(b.refundedP||0)+refund;patch.ledger=[...(b.ledger||[]),{type:"REFUND",amountP:refund,ref:"rfnd_"+rid(8),at:nowISO()}];}
    await Store.update("bookings",id,patch);
    toast(refund?`Cancelled. ${inr(refund)} will be refunded to your payment method.`:"Booking cancelled.");
  });
}
async function checkout(id){
  await Store.lock("b_"+id, async()=>{
    const b=await Store.get("bookings",id);
    if(b.status!=="IN_PROGRESS"||b.providerId!==S.me.mobile) throw new Error("Only the helper can check out an active visit.");
    const patch={status:"COMPLETED",version:(b.version||0)+1,session:{...(b.session||{}),checkOutAt:nowISO()},history:hist(b,"COMPLETED","Helper checked out · visit completed")};
    if(b.shopping){
      const s=b.shopping;
      if(s.items.some(i=>i.status==="PENDING")) throw new Error("Mark every item as bought or not available first.");
      if(s.items.some(i=>i.sub&&i.sub.status==="PROPOSED")) throw new Error("Wait for the customer to answer the substitution request.");
      const spent=shoppingSpent(b);
      if(s.items.some(i=>i.status==="BOUGHT"||i.status==="SUBSTITUTED")&&!(s.receipts||[]).length) throw new Error("Add the shop receipt before checking out.");
      if(spent>s.budgetP) throw new Error(`Receipts total ${inr(spent)}, above the ${inr(s.budgetP)} cap. Contact the customer and operations.`);
      const back=s.budgetP-spent;
      patch.shopping={...s,reconciled:true};
      patch.ledger=[...(b.ledger||[]),{type:"PURCHASE_SPEND",amountP:spent,ref:"receipts",at:nowISO()},...(back?[{type:"PURCHASE_REFUND",amountP:back,ref:"rfnd_"+rid(8),at:nowISO()}]:[])];
      patch.refundedP=(b.refundedP||0)+back;
    }
    if(b.gov&&!(b.gov.updates||[]).length) throw new Error("Record at least one progress step for the government task.");
    if(b.elderly&&b.elderly.notify) patch.history.push({at:nowISO(),to:"COMPLETED",by:"system",role:"system",note:"Family notified of check-out"});
    await Store.update("bookings",id,patch);
    toast("Visit completed.");
  });
}
async function settle(id){
  await Store.lock("b_"+id, async()=>{
    const b=await Store.get("bookings",id), m=money(b);
    if(b.status!=="COMPLETED") throw new Error("Only completed bookings can be settled.");
    if(m.due>0) throw new Error("The customer still owes "+inr(m.due)+".");
    if(S.incidents.some(i=>i.bookingId===id&&i.status==="OPEN")) throw new Error("Resolve the open incident first.");
    const earned=b.price.service+b.price.travel+m.adjService, commission=Math.round(Math.max(0,b.price.service+m.adjService)*FEES.commissionPct/100), reimburse=shoppingSpent(b);
    const payout=earned-commission+reimburse;
    await Store.update("bookings",id,{status:"SETTLED",version:(b.version||0)+1,history:hist(b,"SETTLED","Helper payout settled"),
      settlement:{earnedP:earned,commissionP:commission,reimburseP:reimburse,payoutP:payout,at:nowISO()},
      ledger:[...(b.ledger||[]),{type:"COMMISSION",amountP:commission,ref:"stl",at:nowISO()},{type:"PROVIDER_PAYOUT",amountP:payout,ref:"payout_"+rid(8),at:nowISO()}]});
    toast("Settled "+inr(payout)+" to "+b.providerName+".");
  });
}

    [68,{mobile:"9000000001",name:"Anitha Mohan"},"helper","Namaskaram! Happy to help. I'll bring an umbrella in case it rains. Does she need anything to drink on the way?"],
    [66,{mobile:"9000000001",name:"Anitha Mohan"},"helper","I'll check in when I reach the gate."],
    [60,DEMO_CUSTOMER,"customer","A small bottle of water is enough. Thank you!"]];
  let n=0; for(const [m,who,role,text] of msgs) await Store.set("messages","demo-msg-"+(++n),{bookingId:DEMO_BOOKING_ID,from:who.mobile,name:who.name,role,text,at:iso(now-m*60000)});
}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g&&!e.target.closest("[data-act]")&&!e.target.closest("form [type=submit]")){
    const [v,tab]=g.dataset.go.split(":");
    const p={};
    if(tab) p.tab=tab; if(g.dataset.tab) p.tab=g.dataset.tab; if(g.dataset.f) p.f=g.dataset.f;
    if(g.dataset.id) p.id=g.dataset.id; if(g.dataset.svc) p.svc=g.dataset.svc;
    if(!S.me) return;
    go(v,p); return;
  }
  const a=e.target.closest("[data-act]");
  if(a&&actions[a.dataset.act]){ e.preventDefault(); actions[a.dataset.act]({...a.dataset}); }
  if(e.target.id==="sheet") closeSheet();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(S.drawer){S.drawer=false;render();} else if(S.sheet) closeSheet(); else if(S.details){S.details=false;render();} }
  if(e.target.id==="msg-input"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); e.target.form.requestSubmit(); }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="link"]')){e.preventDefault();e.target.click();}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const fn=forms[f.dataset.form]; if(fn) guard(()=>fn(f,e.submitter));
});
document.addEventListener("input",e=>{ if(e.target.id==="msg-input") autosize(); if(e.target.matches("[data-live]")) render(); });

/* ---------- boot ---------- */
render();
(async()=>{
  await Store.init();
  let n=0, booted=false; const loaded=()=>{ if(++n<4) return; boot(); };
  async function boot(){
    if(booted) return; booted=true;
    if(Store.mode==="local"&&!S.providers.length){ for(const [id,d] of SAMPLE_HELPERS){ const acct={mobile:id,name:d.name,language:"ml",createdAt:d.createdAt,status:"ACTIVE"}; await Store.set("accounts",id,acct); await Store.set("providers",id,d); } await seedDemo(); }
    const sess=lsGet("ksc-session");
    if(sess&&sess.mobile){ const acct=await Store.get("accounts",sess.mobile); if(acct){ S.me={...acct,mobile:sess.mobile}; loadSeen(); S.mode="customer"; S.view="home"; } }
    lastKey=""; render();
  }
  let knownMsgs=null;
  const sub=(col,key)=>{ let first=true; Store.watch(col,list=>{
    if(col==="messages"&&S.me){
      if(knownMsgs) for(const m of list){ if(knownMsgs.has(m.id)||m.from===S.me.mobile) continue;
        const b=bookingById(m.bookingId); if(!b) continue;
        const mine=S.mode==="admin"||b.customerMobile===S.me.mobile||b.providerId===S.me.mobile;
        if(mine&&!(S.view==="booking"&&S.p.id===b.id)) toast((m.role==="operations"?"Operations":m.name)+": "+m.text.slice(0,80)); }
      knownMsgs=new Set(list.map(m=>m.id));
    }
    S[key]=list; if(first){first=false;loaded()} if(booted) render(); }); };
  sub("providers","providers"); sub("bookings","bookings"); sub("incidents","incidents"); sub("messages","messages");
  setTimeout(boot,5000);
})();
</script>
